<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Config - FAST >>> PASS</title>
    <script src="js/lib/CSInterface.js"></script>
    <link rel="stylesheet" href="setup.css?v=2">
</head>
<body>
    <header>
        <h1>DASHBOARD <span>CONFIG v2.8</span></h1>
        <div class="debug-row">
            <span class="debug-label">DEBUG MODE</span>
            <label class="switch">
                <input type="checkbox" id="check-debug">
                <span class="slider"></span>
            </label>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('TNs', event)">TNs</button>
        <button class="tab-btn" onclick="showTab('Sumari Matins', event)">Sumari</button>
        <button class="tab-btn" onclick="showTab('Fotomató', event)">Fotomató</button>
        <button class="tab-btn" onclick="showTab('User Defined', event)">User Dev</button>
        <button class="tab-btn" id="btn-general" onclick="showTab('General', event)">Config Gral</button>
    </div>

    <!-- TAB: GENERAL -->
    <div id="General" class="tab-content">
        <div class="card">
            <h2>Dades d'Editor</h2>
            <div class="row">
                <div class="input-group grow-2">
                    <label>Nom de l'Editor (Nick)</label>
                    <input type="text" id="val-autor">
                </div>
                <div class="input-group grow-1">
                    <label>Finestra Guarda (h)</label>
                    <input type="number" id="val-guarda" value="22">
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Rutes de Xarxa (Infraestructura)</h2>
            <div class="input-group"><label>Plantilla del Canal</label><div class="path-box"><input type="text" id="path-plantilla"><button class="btn-browse" title="Prova aquesta ruta" onclick="provaRuta('path-plantilla')">🧪</button><button class="btn-browse" onclick="browseFile('path-plantilla')">📁</button></div></div>
            <div class="input-group"><label>Repositori Media (MP4/SRT)</label><div class="path-box"><input type="text" id="path-vertical"><button class="btn-browse" title="Prova aquesta ruta" onclick="provaRuta('path-vertical')">🧪</button><button class="btn-browse" onclick="browseFolder('path-vertical')">📁</button></div></div>
            <div class="input-group"><label>Motor Rètols (Wott/MOV)</label><div class="path-box"><input type="text" id="path-chyrons"><button class="btn-browse" title="Prova aquesta ruta" onclick="provaRuta('path-chyrons')">🧪</button><button class="btn-browse" onclick="browseFolder('path-chyrons')">📁</button></div></div>
            <div class="input-group"><label>Biblioteca Conductors</label><div class="path-box"><input type="text" id="path-conductors"><button class="btn-browse" title="Prova aquesta ruta" onclick="provaRuta('path-conductors')">🧪</button><button class="btn-browse" onclick="browseFolder('path-conductors')">📁</button></div></div>
            <div class="input-group"><label>Projectes (destí dels blocs)</label><div class="path-box"><input type="text" id="path-destino_base"><button class="btn-browse" title="Prova aquesta ruta" onclick="provaRuta('path-destino_base')">🧪</button><button class="btn-browse" onclick="browseFolder('path-destino_base')">📁</button></div></div>
            <div class="input-group"><label>Escaletes (digition)</label><div class="path-box"><input type="text" id="path-escaletes"><button class="btn-browse" title="Prova aquesta ruta" onclick="provaRuta('path-escaletes')">🧪</button><button class="btn-browse" onclick="browseFolder('path-escaletes')">📁</button></div></div>
            <div class="input-group"><label>Escaletes · Domini (alternativa)</label><div class="path-box"><input type="text" id="path-escaletes_domini"><button class="btn-browse" title="Prova aquesta ruta" onclick="provaRuta('path-escaletes_domini')">🧪</button><button class="btn-browse" onclick="browseFolder('path-escaletes_domini')">📁</button></div></div>
            <div class="input-group"><label>Grafismes (MAPA del dia)</label><div class="path-box"><input type="text" id="path-grafismos"><button class="btn-browse" title="Prova aquesta ruta" onclick="provaRuta('path-grafismos')">🧪</button><button class="btn-browse" onclick="browseFolder('path-grafismos')">📁</button></div></div>
            <div class="input-group"><label>Subtítols 15 min (SRT emergència)</label><div class="path-box"><input type="text" id="path-subtitulos"><button class="btn-browse" title="Prova aquesta ruta" onclick="provaRuta('path-subtitulos')">🧪</button><button class="btn-browse" onclick="browseFolder('path-subtitulos')">📁</button></div></div>
            <div class="input-group"><label>Subtítols sintètics</label><div class="path-box"><input type="text" id="path-subtitulosSinteticos"><button class="btn-browse" title="Prova aquesta ruta" onclick="provaRuta('path-subtitulosSinteticos')">🧪</button><button class="btn-browse" onclick="browseFolder('path-subtitulosSinteticos')">📁</button></div></div>
            <div id="rutes-status"></div>
        </div>

        <div class="card">
            <h2>Destins d'Exportació (Render)</h2>
            <div class="input-group"><label>Carpeta Publicació 1</label><div class="path-box"><input type="text" id="path-render1"><button class="btn-browse" onclick="browseFolder('path-render1')">📁</button></div></div>
            <div class="input-group"><label>Carpeta Publicació 2</label><div class="path-box"><input type="text" id="path-render2"><button class="btn-browse" onclick="browseFolder('path-render2')">📁</button></div></div>
            <div class="input-group"><label>Carpeta Portades (PNG)</label><div class="path-box"><input type="text" id="path-portadas"><button class="btn-browse" onclick="browseFolder('path-portadas')">📁</button></div></div>
        </div>

        <div class="card">
            <h2>Variables de Ruta (plantilles)</h2>
            <div class="hint">
                Es poden usar a qualsevol ruta:
                <code>{autor}</code> <code>{prog}</code> <code>{archivo}</code> <code>{wott}</code>
                <code>{bloque}</code> <code>{fecha}</code> (YYYY_MM_DD) <code>{tema}</code> <code>{base}</code>
            </div>
            <div class="path-box">
                <input type="text" id="tpl-prova" value="{base}\{archivo}\{fecha}">
                <button class="btn-browse btn-prova" title="Resol la plantilla amb un context d'exemple" onclick="provaPlantilla()">PROVA</button>
            </div>
            <div id="tpl-resultat"></div>
        </div>
    </div>

    <!-- TABS DINÀMIQUES -->
    <div id="TNs" class="tab-content active"></div>
    <div id="Sumari Matins" class="tab-content"></div>
    <div id="Fotomató" class="tab-content"></div>
    <div id="User Defined" class="tab-content"></div>

    <footer>
        <button class="secondary" onclick="window.parent.FASTPASS_UI.Workflows.Config.toggleSetup(false)">TANCAR SENSE DESAR</button>
        <button class="primary" onclick="salvarTodo()">GUARDAR CONFIG [Profile.json]</button>
    </footer>

    <!-- (2026-10-21) SELECTOR DE CARPETES/FITXERS: accessos ràpids + ruta enganxable.
         Substitueix `cep.fs.showOpenDialog` (el diàleg del sistema no porta els
         accessos ràpids de l'Explorador); el diàleg natiu queda al botó SISTEMA… -->
    <div id="fp-picker" class="fp-picker-backdrop">
        <div class="fp-picker">
            <div class="fp-picker-head">
                <strong id="fp-picker-title">Tria carpeta</strong>
                <button class="btn-browse" title="Tancar (Esc)" onclick="pickerClose()">×</button>
            </div>
            <div class="fp-picker-bar">
                <button class="btn-browse" title="Carpeta pare" onclick="pickerUp()">↑</button>
                <input type="text" id="fp-picker-path" placeholder="Enganxa una ruta (\\servidor\share o C:\carpeta) i prem Enter"
                       onkeydown="if (event.key === 'Enter') { event.preventDefault(); pickerGo(this.value); }">
                <button class="secondary" onclick="pickerGo(document.getElementById('fp-picker-path').value)">ANAR</button>
            </div>
            <div class="fp-picker-body">
                <div class="fp-picker-quick" id="fp-picker-quick"></div>
                <div class="fp-picker-list" id="fp-picker-list"></div>
            </div>
            <div class="fp-picker-foot">
                <span id="fp-picker-status">—</span>
                <span class="fp-picker-actions">
                    <button class="secondary" onclick="pickerNative()" title="Diàleg de fitxers del sistema">SISTEMA…</button>
                    <button class="primary" id="fp-picker-use" onclick="pickerUse()">USAR AQUESTA CARPETA</button>
                </span>
            </div>
        </div>
    </div>

    <script>
        const csInterface = new CSInterface();
        let currentProfile = {};

        /**
         * getProfilePath: ruta FÍSICA del Profile.json (arrel de l'extensió).
         */
        function getProfilePath() {
            return String(csInterface.getSystemPath(SystemPath.EXTENSION)) + "/Profile.json";
        }

        /** stripBom: lleva la marca BOM que CEP pot deixar al començament. */
        function stripBom(s) {
            s = String(s == null ? '' : s);
            return (s.charCodeAt(0) === 0xFEFF) ? s.substring(1) : s;
        }

        /**
         * readProfileText: llig Profile.json en UTF-8 de debò.
         *
         * (2026-10-21) ABANS es llegia amb `IO.readTxt` (pont JSX): eixe mètode llig
         * en ANSI i trenca els accents, a més de dependre de l'evalScript. Ara es fa
         * amb `cep.fs.readFile` (el MATEIX mecanisme que `11_Configuracio.js`); el
         * pont queda com a xarxa de seguretat.
         * @returns {string|null} text o null si no s'ha pogut llegir
         */
        function readProfileText(path) {
            try {
                if (window.cep && window.cep.fs && window.cep.fs.readFile) {
                    const r = window.cep.fs.readFile(path);
                    if (r && r.err === 0 && r.data != null) return stripBom(r.data);
                }
            } catch (eFs) { }
            return null;
        }

        async function init() {
            const profilePath = getProfilePath();

            // 1) Via directa (UTF-8, sense pont). 2) Si no hi ha cep.fs: IO.readTxt.
            const txt = readProfileText(profilePath);
            if (txt != null) {
                try {
                    currentProfile = JSON.parse(txt);
                    drawConfig();
                } catch (eJson) {
                    alert("Profile.json no és JSON vàlid:\n" + (eJson && eJson.message));
                }
                return;
            }
            
            csInterface.evalScript(`IO.readTxt('${profilePath.replace(/\\/g, '\\\\')}')`, function(res) {
                if(res && res !== "ERR") {
                    currentProfile = JSON.parse(res);
                    drawConfig();
                } else {
                    alert("Error llegint Profile.json.");
                }
            });
        }

        function drawConfig() {
            // General
            document.getElementById('val-autor').value = currentProfile.general.autor;
            document.getElementById('val-guarda').value = currentProfile.general.guarda;
            document.getElementById('check-debug').checked = currentProfile.general.debug;
            
            // Rutas (F2): les que falten al Profile.json es preomplen amb el valor
            // vigent del panell (rutes derivades), perque el camp no isca buit.
            var FALLBACK = {
                projectes: 'projectes', destino_base: 'projectes',
                escaletes: 'escaletes', escaletes_domini: 'escaletesDomini',
                grafismos: 'grafismos', subtitulos: 'subtitulos',
                subtitulosSinteticos: 'subtitulosSinteticos'
            };
            var cfgPare = null;
            try { cfgPare = window.parent.FASTPASS_UI.Config.get(); } catch (ePare) { cfgPare = null; }
            document.querySelectorAll('input[id^="path-"]').forEach(function(el) {
                const key = el.id.replace(/^path-/, '');
                let v = (currentProfile.rutas && currentProfile.rutas[key]) || '';
                if (!v && cfgPare && cfgPare.rutas && FALLBACK[key]) v = cfgPare.rutas[FALLBACK[key]] || '';
                el.value = v;
            });

            // Pestañes d'Estructures
            ["TNs", "Sumari Matins", "Fotomató", "User Defined"].forEach(tabName => {
                const container = document.getElementById(tabName);
                const est = currentProfile.estructuras[tabName] || { tracks: {}, programas: [] };
                
                let html = `
                    <div class="card">
                        <h2>Mapatge de Pistes (Track Mapping)</h2>
                        <div class="track-map">
                            ${Object.keys(est.tracks).map(k => `
                                <div class="track-item">
                                    <label>${k.replace('v_', 'V').replace('s_', 'S')}</label>
                                    <input type="number" id="tr-${tabName}-${k}" value="${est.tracks[k]}" onchange="updateTrack('${tabName}', '${k}', this.value)">
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="card">
                        <h2>Gestió de Programes</h2>
                        <div class="program-row program-head">
                            <span>ID / NOM (Selector)</span><span>NOM ARXIU</span><span>CARPETA (dir)</span><span>WOTT</span><span>CONDUCTOR</span><span></span>
                        </div>
                        <div id="prog-list-${tabName.replace(/ /g, '')}">
                            ${est.programas.map((p, idx) => `
                                <div class="program-row">
                                    <input type="text" value="${p.id}" onchange="updateProg('${tabName}', ${idx}, 'id', this.value)" title="Text del desplegable PROGRAMA (pot portar espais; ha de ser unic)">
                                    <input type="text" value="${p.archivo}" onchange="updateProg('${tabName}', ${idx}, 'archivo', this.value)" title="NOM ARXIU: fa els noms de carpeta i de fitxer (TN_MIGDIA...)">
                                    <input type="text" value="${p.dir || ''}" onchange="updateProg('${tabName}', ${idx}, 'dir', this.value)" title="CARPETA (dir): subcarpeta de projectes dins de PROJECTES (p.ex. 01_MATINS_PROJECTES). Es la que fa la ruta del projecte -> si falta, el projecte cau a l'ARREL">
                                    <input type="text" value="${p.wott}" onchange="updateProg('${tabName}', ${idx}, 'wott', this.value)" title="Prefixo Wott">
                                    <input type="text" value="${p.conductor || ''}" onchange="updateProg('${tabName}', ${idx}, 'conductor', this.value)" placeholder="MOV file">
                                    <button class="btn-delete" title="Esborrar programa" onclick="removeProg('${tabName}', ${idx})">×</button>
                                </div>
                            `).join('')}
                        </div>
                        <button class="secondary btn-add" onclick="addProg('${tabName}')">+ AFEGIR PROGRAMA</button>
                    </div>
                `;
                container.innerHTML = html;
            });
        }

        // Lògica de Edició Dinàmica
        function updateTrack(tab, key, val) {
            currentProfile.estructuras[tab].tracks[key] = parseInt(val);
        }

        function updateProg(tab, idx, key, val) {
            currentProfile.estructuras[tab].programas[idx][key] = val;
        }

        function addProg(tab) {
            // (2026-10-21) `dir` es OBLIGATORI a la practica: es la subcarpeta de
            // projectes que fa servir utils.workFolder. Es crea buit i la guarda de
            // `salvarTodo` avisa si es desa sense omplir.
            currentProfile.estructuras[tab].programas.push({ id: "NOU", archivo: "NOU", dir: "", wott: "XXX", conductor: "" });
            drawConfig();
        }

        function removeProg(tab, idx) {
            if(confirm("Segur que vols eliminar aquest programa?")) {
                currentProfile.estructuras[tab].programas.splice(idx, 1);
                drawConfig();
            }
        }

        function showTab(name, event) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.target.classList.add('active');
        }

        async function salvarTodo() {
            // Recollir camps General i Rutas abans de salvar
            currentProfile.general.autor = document.getElementById('val-autor').value;
            currentProfile.general.guarda = parseInt(document.getElementById('val-guarda').value);
            currentProfile.general.debug = document.getElementById('check-debug').checked;

            // Rutas (F2): es recullen TOTS els camps `path-*` del DOM (aixi tambe
            // s'escriuen les claus noves en un Profile.json antic).
            if (!currentProfile.rutas) currentProfile.rutas = {};
            document.querySelectorAll('input[id^="path-"]').forEach(function(el) {
                currentProfile.rutas[el.id.replace(/^path-/, '')] = el.value;
            });

            const profilePath = getProfilePath();

            // (2026-10-21) GUARDA: cap programa sense CARPETA (dir). `dir` es la
            // subcarpeta de projectes que fa servir utils.workFolder
            // (destinoBase + dir + data + bloc): si falta, el projecte es crea a
            // l'ARREL de la carpeta de projectes i es barreja amb els altres.
            const senseDir = [];
            const ests = currentProfile.estructuras || {};
            Object.keys(ests).forEach(function (tab) {
                const progs = (ests[tab] && ests[tab].programas) || [];
                progs.forEach(function (p) {
                    if (!p) return;
                    if (String(p.dir == null ? '' : p.dir).trim() === '') {
                        senseDir.push(tab + '  ->  ' + (p.id || '(sense nom)'));
                    }
                });
            });
            if (senseDir.length && !confirm(
                'Aquests programes NO tenen CARPETA (dir):\n\n  ' + senseDir.join('\n  ') +
                '\n\nSense carpeta, el projecte es crea a l\'ARREL de la carpeta de projectes.' +
                '\n\nVols desar-ho igualment?')) {
                return;
            }

            // ── ESCRIPTURA (2026-10-21) ──────────────────────────────────────────
            // BUG: el perfil s'enviava a `IO.writeTxt` DINS d'un literal de JSX
            // (`evalScript`). Eixe literal NO pot portar salts de línia i el JSON
            // s'hi enviava amb `JSON.stringify(obj, null, 4)` → el motor responia
            // «EvalScript error» i la config no es desava mai.
            // Ara s'escriu DIRECTAMENT des del panell amb `cep.fs.writeFile` (el
            // mateix mecanisme amb què `11_Configuracio.js` el LLEGIX), sense cap
            // pont; el payload del fallback va en UNA SOLA LÍNIA (vore davall).
            const json = JSON.stringify(currentProfile, null, 4);
            let writeErr = '';
            try {
                if (window.cep && window.cep.fs && window.cep.fs.writeFile) {
                    let r = window.cep.fs.writeFile(profilePath, json, 'UTF-8');
                    // CEP vells no accepten el 3r argument (encoding): reintent sense.
                    if (!r || r.err !== 0) r = window.cep.fs.writeFile(profilePath, json);
                    if (!r || r.err !== 0) writeErr = 'cep.fs err=' + (r ? r.err : '?');
                } else {
                    writeErr = 'cep.fs no disponible';
                }
            } catch (eW) { writeErr = (eW && eW.message) || 'excepció en escriure'; }

            if (!writeErr) {
                // Verificació real: es rellegeix i es parseja. Una escriptura
                // truncada deixaria el panell sense config en el pròxim arrencada.
                const chk = readProfileText(profilePath);
                let chkOk = false;
                try { chkOk = !!(chk && JSON.parse(chk)); } catch (eChk) { chkOk = false; }
                if (chkOk) {
                    alert("Configuració desada a Profile.json");
                    csInterface.dispatchEvent(new CSXSEvent('FASTPASS_CONFIG_UPDATED', 'APPLICATION'));
                    window.parent.FASTPASS_UI.Workflows.Config.toggleSetup(false);
                    return;
                }
                writeErr = 'escriptura NO verificada (el fitxer rellegit no és JSON)';
            }

            // ── FALLBACK (només si `cep.fs` falla) ───────────────────────────────
            // `payload` ha d'anar en UNA línia: el literal d'ExtendScript no pot
            // tindre salts de línia (era la causa de l'«EvalScript error»).
            // Escapem cometes simples per al bridge JSX
            const payload = JSON.stringify(currentProfile).replace(/'/g, "\\'");

            csInterface.evalScript(`IO.writeTxt('${profilePath.replace(/\\/g, '\\\\')}', '${payload}')`, function(res) {
                if(res && res.indexOf("OK") !== -1) {
                    alert("Configuració física desada al Profile.json");
                    csInterface.dispatchEvent(new CSXSEvent('FASTPASS_CONFIG_UPDATED', 'APPLICATION'));
                    window.parent.FASTPASS_UI.Workflows.Config.toggleSetup(false);
                } else {
                    alert("❌ No s'ha pogut desar Profile.json\n" +
                        "Motiu: " + writeErr + "\nPont JSX: " + res);
                }
            });
        }

        // ── F2 (2026-10-21) · PROVA DE RUTES I PLANTILLES ───────────────────
        // La resolucio dels {tokens} la fa el PANELL (FASTPASS_UI.Config.resolvePath
        // → Logic.Rutas): ací NO es duplica cap logica de variables.
        function sampleCtx() {
            const p = currentProfile || {};
            let prog = null;
            try {
                const est = (p.estructuras || {})['TNs'] || {};
                prog = (est.programas || [])[0] || null;
            } catch (e) { prog = null; }
            const avui = new Date();
            const p2 = function (n) { return (n < 10 ? '0' : '') + n; };
            const fecha = avui.getFullYear() + '_' + p2(avui.getMonth() + 1) + '_' + p2(avui.getDate());
            const elBase = document.getElementById('path-destino_base');
            return {
                autor: (p.general && p.general.autor) || 'AGUS',
                prog: prog ? prog.id : 'TNM',
                archivo: prog ? prog.archivo : 'TN_MIGDIA',
                wott: prog ? prog.wott : 'TNM',
                bloque: 'V1',
                fecha: fecha,
                tema: 'TEMA_EXEMPLE',
                base: elBase ? elBase.value : ''
            };
        }

        function resolveTpl(tpl) {
            let cfg = null;
            try { cfg = window.parent.FASTPASS_UI.Config; } catch (e) { cfg = null; }
            if (cfg && cfg.resolvePathDetailed) return cfg.resolvePathDetailed(tpl, sampleCtx());
            return { out: tpl, missing: [], unknown: [], tokens: [], noParent: true };
        }

        // existeixRuta: stat (fitxers) o readdir (carpetes). Mai llança.
        function existeixRuta(p, cb) {
            let r = null;
            try { r = window.cep.fs.stat(p); } catch (e1) { r = null; }
            if (r && r.err === 0) { cb(true); return; }
            try { r = window.cep.fs.readdir(p); } catch (e2) { r = null; }
            cb(!!(r && r.err === 0));
        }

        function pintaEstat(elId, txt, color) {
            const el = document.getElementById(elId);
            if (!el) return;
            el.style.color = color || '#777';
            el.textContent = txt;
        }

        function diagnosi(d) {
            let txt = '';
            if (d.missing && d.missing.length) txt += ' · FALTA ' + d.missing.map(function (k) { return '{' + k + '}'; }).join(' ');
            if (d.unknown && d.unknown.length) txt += ' · DESCONEGUT ' + d.unknown.map(function (k) { return '{' + k + '}'; }).join(' ');
            return txt;
        }

        window.provaRuta = function (id) {
            const el = document.getElementById(id);
            if (!el) return;
            const key = id.replace(/^path-/, '');
            const tpl = el.value || '';
            if (!tpl) { pintaEstat('rutes-status', '🧪 ' + key + ': camp buit', '#ffb300'); return; }
            const d = resolveTpl(tpl);
            if (d.noParent) { pintaEstat('rutes-status', '🧪 No puc accedir al panell (Config.resolvePath)', '#ff5252'); return; }
            const txt = '🧪 ' + key + ' → ' + (d.out || '(buit)') + diagnosi(d);
            pintaEstat('rutes-status', txt + ' · comprovant...', '#777');
            existeixRuta(d.out, function (ok) {
                const mal = (d.missing && d.missing.length) || (d.unknown && d.unknown.length);
                pintaEstat('rutes-status', txt + ' · ' + (ok ? 'EXISTEIX' : 'NO EXISTEIX'),
                    mal ? '#ff5252' : (ok ? '#00c853' : '#ffb300'));
            });
        };

        window.provaPlantilla = function () {
            const el = document.getElementById('tpl-prova');
            const d = resolveTpl(el ? el.value : '');
            if (d.noParent) { pintaEstat('tpl-resultat', 'No puc accedir al panell (Config.resolvePath)', '#ff5252'); return; }
            const mal = (d.missing && d.missing.length) || (d.unknown && d.unknown.length);
            pintaEstat('tpl-resultat', (d.out || '(buit)') + diagnosi(d), mal ? '#ff5252' : '#00c853');
            const out = document.getElementById('tpl-resultat');
            if (out && d.tokens && d.tokens.length) out.title = 'Tokens: ' + d.tokens.join(', ');
        };


        // ── SELECTOR DE CARPETES/XITXERS (2026-10-21 · revisat #177) ─────────
        // El botó 📁 obri DIRECTAMENT el diàleg del SISTEMA (`cep.fs.showOpenDialog`):
        // és el MATEIX que obria el botó SISTEMA…, porta els accessos ràpids de
        // l'Explorador (Accés ràpid, Documents, Baixades, discos…) i deixa enganxar
        // una ruta UNC. Ja NO s'obri el selector HTML: queda només com a XARXA DE
        // SEGURETAT si `cep.fs.showOpenDialog` no existix o llança.
        //
        // LÍMIT CONEGUT: el MODE DE VISTA (llista/detalls vs icones grans) el decidix
        // Windows i recorda l'últim de cada carpeta; l'API de CEP no el pot forçar.
        // Posar-lo en "Detalls" una vegada dins la carpeta és suficient.
        var _fpPicker = { id: null, mode: 'folder', ext: [], dir: '', sel: '', token: 0, quick: null };

        function cepFs() { return (window.cep && window.cep.fs) ? window.cep.fs : null; }

        /** isDirPath: existix i és carpeta (`readdir` és la prova barata). */
        function isDirPath(p) {
            var fs = cepFs();
            if (!fs || !p) return false;
            try { var r = fs.readdir(String(p)); return !!(r && r.err === 0); } catch (e) { return false; }
        }
        /** listPaths: noms de dins d'una carpeta (null si no es pot llegir). */
        function listPaths(p) {
            var fs = cepFs();
            if (!fs || !p) return null;
            try { var r = fs.readdir(String(p)); return (r && r.err === 0 && r.data) ? r.data : null; } catch (e) { return null; }
        }
        function pathJoin(a, b) {
            var s = String(a || '').replace(/[\\/]+$/, '');
            return s ? (s + '\\' + String(b || '')) : String(b || '');
        }
        function pathParent(p) {
            var s = String(p || '').replace(/[\\/]+$/, '');
            if (!s) return '';
            if (/^[a-zA-Z]:$/.test(s)) return s + '\\';                  // arrel d'un disc
            if (/^\\\\[^\\]+\\[^\\]+$/.test(s)) return s;                 // arrel d'un share UNC
            var i = Math.max(s.lastIndexOf('\\'), s.lastIndexOf('/'));
            if (i < 0) return '';
            if (i === 2 && /^[a-zA-Z]:/.test(s)) return s.substring(0, 2) + '\\';
            return s.substring(0, i);
        }
        function setPickerStatus(txt, color) {
            var el = document.getElementById('fp-picker-status');
            if (!el) return;
            el.textContent = txt || '—';
            el.style.color = color || '#777';
        }
        function pickerEmpty(txt) {
            var el = document.createElement('div');
            el.className = 'fp-picker-empty';
            el.textContent = txt;
            return el;
        }
        /** quickDirs: accessos ràpids (es calculen una volta; cache a _fpPicker.quick). */
        function quickDirs() {
            if (_fpPicker.quick) return _fpPicker.quick;
            var out = [], seen = {};
            function add(label, p) {
                if (!p) return;
                var key = String(p).toLowerCase().replace(/[\\/]+$/, '');
                if (!key || seen[key]) return;
                seen[key] = 1;
                out.push({ label: label, path: p });
            }
            var docs = '';
            try { docs = csInterface.getSystemPath(SystemPath.MY_DOCUMENTS) || ''; } catch (eDocs) { docs = ''; }
            if (docs) {
                add('📄 Documents', docs);
                var home = pathParent(docs);
                if (home) {
                    add('🏠 ' + home, home);
                    ['Desktop|🖥 Escriptori', 'Downloads|⬇ Baixades', 'Pictures|🖼 Imatges', 'Videos|🎬 Vídeos', 'OneDrive|☁ OneDrive']
                        .forEach(function (pair) {
                            var bits = pair.split('|');
                            var p = pathJoin(home, bits[0]);
                            if (isDirPath(p)) add(bits[1], p);
                        });
                }
            }
            // Discos: `readdir` sobre l'arrel és la prova barata (les lletres que no
            // existixen tornen err immediat).
            'CDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(function (ch) {
                var root = ch + ':\\';
                if (isDirPath(root)) add('💽 ' + root, root);
            });
            // Les rutes que ja estan al perfil: el cas més habitual és reutilitzar-les.
            document.querySelectorAll('input[id^="path-"]').forEach(function (el) {
                var v = String(el.value || '').trim();
                if (v) add('🔗 ' + el.id.replace(/^path-/, ''), v);
            });
            _fpPicker.quick = out;
            return out;
        }
        function pickerRenderQuick() {
            var box = document.getElementById('fp-picker-quick');
            if (!box) return;
            box.innerHTML = '';
            var dirs = quickDirs();
            if (!dirs.length) { box.appendChild(pickerEmpty('(sense accessos)')); return; }
            dirs.forEach(function (d) {
                var el = document.createElement('div');
                el.textContent = d.label;
                el.title = d.path;
                el.onclick = function () { pickerGo(d.path); };
                box.appendChild(el);
            });
        }
        function pickerMatch(nm) {
            if (!_fpPicker.ext || !_fpPicker.ext.length) return true;
            var low = String(nm).toLowerCase();
            return _fpPicker.ext.some(function (x) {
                return low.length > x.length && low.slice(-(x.length + 1)) === '.' + x;
            });
        }

        /** pickerList: llig la carpeta a TROSSOS (40 entrades per volta) i la pinta. */
        function pickerList() {
            var box = document.getElementById('fp-picker-list');
            if (!box) return;
            var dir = _fpPicker.dir;
            box.innerHTML = '';
            if (!dir) { box.appendChild(pickerEmpty('Escriu o enganxa una ruta.')); return; }
            var names = listPaths(dir);
            if (!names) {
                box.appendChild(pickerEmpty('❌ No puc llegir: ' + dir));
                setPickerStatus('No existix o no tens permisos', '#ff5252');
                return;
            }
            var token = ++_fpPicker.token;       // invalida escanejats anteriors
            box.appendChild(pickerEmpty('Llegint… ' + names.length + ' entrades'));
            var dirs = [], files = [], i = 0;
            function step() {
                if (token !== _fpPicker.token) return;
                var end = Math.min(i + 40, names.length);
                for (; i < end; i++) {
                    var nm = String(names[i] || '');
                    if (!nm) continue;
                    var full = pathJoin(dir, nm);
                    if (isDirPath(full)) dirs.push(nm);
                    else if (_fpPicker.mode === 'file' && pickerMatch(nm)) files.push(nm);
                }
                setPickerStatus('Llegint… ' + i + '/' + names.length);
                if (i < names.length) { setTimeout(step, 0); return; }
                pickerPaintList(dirs, files);
            }
            step();
        }
        function pickerPaintList(dirs, files) {
            var box = document.getElementById('fp-picker-list');
            if (!box) return;
            box.innerHTML = '';
            var cmp = function (a, b) { return a.localeCompare(b, 'ca', { sensitivity: 'base' }); };
            dirs.sort(cmp);
            files.sort(cmp);
            dirs.forEach(function (nm) {
                var full = pathJoin(_fpPicker.dir, nm);
                var el = document.createElement('div');
                el.className = 'fp-picker-item';
                el.textContent = '📁 ' + nm;
                el.title = full;
                el.onclick = function () { pickerSelect(full, el); };
                el.ondblclick = function () { pickerGo(full); };
                box.appendChild(el);
            });
            files.forEach(function (nm) {
                var full = pathJoin(_fpPicker.dir, nm);
                var el = document.createElement('div');
                el.className = 'fp-picker-item file';
                el.textContent = '📄 ' + nm;
                el.title = full;
                el.onclick = function () { pickerSelect(full, el); };
                el.ondblclick = function () { pickerSelect(full, el); pickerUse(); };
                box.appendChild(el);
            });
            if (!dirs.length && !files.length) box.appendChild(pickerEmpty('(cap carpeta)'));
            setPickerStatus(_fpPicker.dir, '#777');
            pickerMarkSel();
        }
        function pickerMarkSel() {
            var box = document.getElementById('fp-picker-list');
            if (!box) return;
            Array.prototype.forEach.call(box.querySelectorAll('.fp-picker-item'), function (el) {
                el.classList.toggle('sel', el.title === _fpPicker.sel);
            });
        }
        function pickerSelect(full, el) {
            _fpPicker.sel = full;
            if (el && el.parentNode) {
                Array.prototype.forEach.call(el.parentNode.children, function (x) { x.classList.remove('sel'); });
                el.classList.add('sel');
            }
            setPickerStatus(full, '#00c853');
        }
        function pickerGo(p) {
            var raw = String(p == null ? '' : p).trim().replace(/^"(.*)"$/, '$1');
            if (!raw) { setPickerStatus('Escriu una ruta', '#ffb300'); return; }
            if (!isDirPath(raw)) { setPickerStatus('❌ No existix: ' + raw, '#ff5252'); return; }
            _fpPicker.dir = raw;
            _fpPicker.sel = raw;
            var inp = document.getElementById('fp-picker-path');
            if (inp) inp.value = raw;
            pickerRenderQuick();
            pickerList();
        }
        function pickerUp() {
            var p = pathParent(_fpPicker.dir);
            if (p && p !== _fpPicker.dir) pickerGo(p);
        }

        function pickerOpen(id, opts) {
            opts = opts || {};
            _fpPicker.id = id;
            _fpPicker.mode = opts.mode || 'folder';
            _fpPicker.ext = (opts.ext || []).map(function (x) { return String(x).toLowerCase().replace(/^\./, ''); });
            _fpPicker.sel = '';
            _fpPicker.quick = null;
            _fpPicker.token++;
            var target = document.getElementById(id);
            var start = target ? String(target.value || '').trim() : '';
            var use = document.getElementById('fp-picker-use');
            if (use) use.textContent = (_fpPicker.mode === 'file') ? 'USAR AQUEST FITXER' : 'USAR AQUESTA CARPETA';
            var ttl = document.getElementById('fp-picker-title');
            if (ttl) ttl.textContent = (_fpPicker.mode === 'file') ? 'Tria un fitxer' : 'Tria una carpeta';
            var box = document.getElementById('fp-picker');
            if (box) box.classList.add('open');
            var inp = document.getElementById('fp-picker-path');
            if (inp) inp.value = start;
            // Si la ruta actual és un FITXER (p. ex. la plantilla .prproj) es comença
            // per la seua carpeta; si no, per la pròpia ruta; si no, per Documents.
            var boot = start;
            if (boot && !isDirPath(boot)) boot = pathParent(boot);
            if (!boot || !isDirPath(boot)) {
                try { boot = csInterface.getSystemPath(SystemPath.MY_DOCUMENTS) || ''; } catch (eB) { boot = ''; }
            }
            if (boot && isDirPath(boot)) pickerGo(boot);
            else { pickerRenderQuick(); pickerList(); }
            if (inp) { inp.focus(); inp.select(); }
        }
        function pickerClose() {
            var box = document.getElementById('fp-picker');
            if (box) box.classList.remove('open');
            _fpPicker.token++;
        }
        function pickerUse() {
            var val = _fpPicker.sel || _fpPicker.dir;
            if (!val) return;
            var target = document.getElementById(_fpPicker.id);
            if (target) target.value = val;
            pickerClose();
        }
        function pickerNative() {
            var r = null;
            try {
                r = (_fpPicker.mode === 'file')
                    ? window.cep.fs.showOpenDialog(false, false, 'Tria Arxiu', null, _fpPicker.ext)
                    : window.cep.fs.showOpenDialog(false, true, 'Tria Carpeta', null);
            } catch (eNat) { r = null; }
            if (r && r.data && r.data.length) {
                var t = document.getElementById(_fpPicker.id);
                if (t) t.value = r.data[0];
                pickerClose();
            }
        }
        document.addEventListener('keydown', function (e) {
            var box = document.getElementById('fp-picker');
            if (!box || !box.classList.contains('open')) return;
            if (e.key === 'Escape') { e.preventDefault(); pickerClose(); }
        });

        /**
         * pickNative: obri el diàleg de fitxers del SISTEMA i posa el resultat al
         * camp `id`.
         *
         * @param {string} id   - id de l'input destí
         * @param {string} mode - 'folder' | 'file'
         * @returns {boolean} true si el diàleg s'HA OBERT (cancel·lar també compta:
         *   aleshores NO s'ha de caure al selector HTML).
         */
        function pickNative(id, mode) {
            var el = document.getElementById(id);
            if (!el) return true;
            var fsApi = cepFs();
            if (!fsApi || typeof fsApi.showOpenDialog !== 'function') return false;
            var cur = String(el.value || '').trim();
            // La ruta inicial ha de ser una CARPETA: si el camp ja és un fitxer
            // (la plantilla .prproj) es comença per la seua carpeta.
            var initial = '';
            if (cur) initial = (mode === 'file' && !isDirPath(cur)) ? pathParent(cur) : cur;
            var r = null;
            try {
                r = (mode === 'file')
                    ? fsApi.showOpenDialog(false, false, 'Tria Arxiu', initial || null, ['prproj'])
                    : fsApi.showOpenDialog(false, true, 'Tria Carpeta', initial || null);
            } catch (eNat) { return false; }
            if (!r) return false;
            if (r.err === 0 && r.data && r.data.length) {
                el.value = r.data[0];
                try { console.log('[setup] diàleg natiu → ' + el.value); } catch (eL) { }
            }
            return true;
        }

        window.browseFolder = function (id) {
            if (!pickNative(id, 'folder')) pickerOpen(id, { mode: 'folder' });
        };
        window.browseFile = function (id) {
            if (!pickNative(id, 'file')) pickerOpen(id, { mode: 'file', ext: ['prproj'] });
        };

        // Tooltip dels botons 📁: obrin el diàleg del SISTEMA (una sola passada).
        Array.prototype.forEach.call(document.querySelectorAll('.btn-browse'), function (b) {
            var oc = String(b.getAttribute('onclick') || '');
            if (oc.indexOf('browseFolder(') === 0 || oc.indexOf('browseFile(') === 0) {
                b.title = "Obrir el diàleg del sistema (accessos ràpids de l'Explorador)";
            }
        });

        init();
    </script>
</body>
